name: Build TileDeck APK

on:
  push:
    paths:
      - "launcher/**"
      - ".github/workflows/build-tiledeck.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk TileDeck.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TileDeck
          path: launcher/TileDeck.apk

      # Same download link every time:
      # https://github.com/<owner>/<repo>/releases/download/tiledeck-latest/TileDeck.apk
      - name: Publish to the tiledeck-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete tiledeck-latest --yes --cleanup-tag || true
          gh release create tiledeck-latest TileDeck.apk \
            --title "TileDeck (latest build)" \
            --notes "Built from ${GITHUB_SHA::7} on ${GITHUB_REF_NAME}. Install TileDeck.apk on your Google TV with the Downloader app." \
            --target "$GITHUB_SHA" \
            --prerelease
